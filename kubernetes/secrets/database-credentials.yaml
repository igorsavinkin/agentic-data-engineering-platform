# Database Credentials Secret (TASK-078).
#
# PostgreSQL password shared by warehouse-loader and API services.
# The value below is a base64-encoded local development default.
#
# IMPORTANT: This is NOT a production password. It exists only to let
# the kind cluster start without manual secret creation.
#
# To create this Secret manually:
#   kubectl create secret generic database-credentials \
#     --namespace ai-data-platform \
#     --from-literal=db-password=postgres

apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: database-credentials
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # postgres (base64)
  db-password: cG9zdGdyZXM=
