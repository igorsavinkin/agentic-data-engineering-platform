# Ingestion API Keys Secret (TASK-078).
#
# Source-specific API keys consumed by the ingestion service. The
# BestBuy API key value below is a placeholder; replace it with a
# real key before running ingestion against the BestBuy API.
#
# To create this Secret manually:
#   kubectl create secret generic ingestion-api-keys \
#     --namespace ai-data-platform \
#     --from-literal=bestbuy-api-key=YOUR_REAL_KEY_HERE

apiVersion: v1
kind: Secret
metadata:
  name: ingestion-api-keys
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: ingestion-api-keys
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # placeholder — replace with a real key before use
  bestbuy-api-key: cGxhY2Vob2xkZXItcmVwbGFjZS1tZQ==
