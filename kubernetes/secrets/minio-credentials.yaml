# MinIO Credentials Secret (TASK-078).
#
# Shared MinIO access credentials consumed by raw-writer, lake-writer,
# and warehouse-loader. The values below are base64-encoded local
# development defaults that match the Docker Compose MinIO setup.
#
# IMPORTANT: These are NOT production credentials. They exist only to
# let the kind cluster start without manual secret creation. In a real
# deployment, replace these with properly managed credentials.
#
# To create this Secret manually instead of applying this manifest:
#   kubectl create secret generic minio-credentials \
#     --namespace ai-data-platform \
#     --from-literal=minio-access-key=minioadmin \
#     --from-literal=minio-secret-key=minioadmin-local

apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: minio-credentials
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  minio-access-key: bWluaW9hZG1pbg==
  # minioadmin-local (base64)
  minio-secret-key: bWluaW9hZG1pbi1sb2NhbA==
