apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ai-data-platform/api:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.api"]
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENVIRONMENT
              value: "production"
            - name: APP_API_HOST
              value: "0.0.0.0"
            - name: APP_API_PORT
              value: "8000"
            - name: WAREHOUSE_DB_HOST
              value: "postgresql"
            - name: WAREHOUSE_DB_PORT
              value: "5432"
            - name: WAREHOUSE_DB_NAME
              value: "warehouse"
            - name: WAREHOUSE_DB_USER
              value: "postgres"
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-password
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
