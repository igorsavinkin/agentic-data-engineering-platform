# Warehouse Loader Deployment (TASK-075, updated TASK-078, TASK-079).
#
# Runs the warehouse loader service which reads Silver Parquet from MinIO
# and loads curated data into PostgreSQL with idempotent upserts. Unlike
# the Kafka-consuming services, this deployment connects to PostgreSQL and
# object storage only.
#
# No inbound Service is created — warehouse loader is a batch-style service
# that periodically reads from the lake and writes to the warehouse.
# Shared configuration is sourced from ConfigMaps (platform-config,
# database-config); credentials from shared Secrets (minio-credentials,
# database-credentials).
#
# This deployment does NOT run Alembic migrations. Schema management is a
# separate concern.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-loader
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: warehouse-loader
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: warehouse-loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse-loader
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-loader
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: warehouse-loader
    spec:
      containers:
        - name: warehouse-loader
          image: ai-data-platform/warehouse-loader:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.warehouse-loader.runner"]
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_MINIO_ENDPOINT
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-access-key
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-secret-key
            - name: WAREHOUSE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_HOST
            - name: WAREHOUSE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_PORT
            - name: WAREHOUSE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_NAME
            - name: WAREHOUSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_USER
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: db-password
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import os; os.getpid()"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('postgresql',5432)); s.close()"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
