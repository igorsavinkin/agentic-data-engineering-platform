# Ingestion Deployment (TASK-071, updated TASK-078, TASK-079).
#
# Runs the ingestion service which fetches from source adapters and
# publishes canonical product observation events to Kafka.
#
# No inbound Service is created — ingestion is a Kafka producer only.
# Configuration is externalized via ConfigMap (platform-config) and
# Secret (ingestion-api-keys).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: ingestion
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion
          image: ai-data-platform/ingestion:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.ingestion"]
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_KAFKA_BOOTSTRAP_SERVERS
            - name: APP_KAFKA_RAW_TOPIC
              value: "products.raw.v1"
            - name: INGESTION_INTERVAL_SECONDS
              value: "60"
            - name: BESTBUY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ingestion-api-keys
                  key: bestbuy-api-key
                  optional: true
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import os; os.getpid()"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('kafka',29092)); s.close()"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
