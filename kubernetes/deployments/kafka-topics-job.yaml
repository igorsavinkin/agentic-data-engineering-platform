apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-setup
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: kafka-topics-setup
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: kafka
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics-setup
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: kafka
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-creator
          image: apache/kafka:4.3.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              TIMEOUT=120
              ELAPSED=0
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timed out waiting for Kafka after ${TIMEOUT}s"
                  exit 1
                fi
                sleep 2
                ELAPSED=$((ELAPSED + 2))
              done
              echo "Kafka is ready. Creating topics..."

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
                --topic products.raw.v1 \
                --partitions 3 \
                --replication-factor 1 \
                --config retention.ms=604800000

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
                --topic products.validated.v1 \
                --partitions 3 \
                --replication-factor 1 \
                --config retention.ms=604800000

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
                --topic products.invalid.v1 \
                --partitions 1 \
                --replication-factor 1 \
                --config retention.ms=604800000

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
                --topic pipeline.events.v1 \
                --partitions 1 \
                --replication-factor 1 \
                --config retention.ms=259200000

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
                --topic data-quality.events.v1 \
                --partitions 1 \
                --replication-factor 1 \
                --config retention.ms=259200000

              echo "All topics created. Listing topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
