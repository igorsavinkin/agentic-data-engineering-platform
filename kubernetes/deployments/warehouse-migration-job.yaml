apiVersion: batch/v1
kind: Job
metadata:
  name: warehouse-migration
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: warehouse-migration
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: warehouse
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-migration
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: warehouse
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ai-data-platform/warehouse-migrations:dev
          command:
            - python
            - -m
            - warehouse.migrations
            - upgrade
            - head
          env:
            - name: WAREHOUSE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_HOST
            - name: WAREHOUSE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_PORT
            - name: WAREHOUSE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_NAME
            - name: WAREHOUSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_USER
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: db-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
