# Processor Deployment (TASK-072, updated TASK-078, TASK-079).
#
# Runs the processor service which consumes raw events from Kafka,
# validates and normalizes them, applies deduplication, and publishes
# valid records to the validated topic. Invalid records are routed to
# the invalid topic with diagnostic context.
#
# No inbound Service is created — processor is a Kafka consumer/producer
# only. Shared configuration is sourced from the platform-config
# ConfigMap; service-specific settings remain as literal env vars.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: processor
    spec:
      containers:
        - name: processor
          image: ai-data-platform/processor:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.processor"]
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_KAFKA_BOOTSTRAP_SERVERS
            - name: APP_KAFKA_GROUP_ID
              value: "processor"
            - name: APP_KAFKA_AUTO_OFFSET_RESET
              value: "earliest"
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import os; os.kill(1, 0)"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('kafka',29092)); s.close()"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
