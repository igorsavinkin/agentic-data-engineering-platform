# Raw Writer Deployment (TASK-073, updated TASK-078).
#
# Runs the raw writer service which consumes raw events from Kafka and
# persists them to Bronze (MinIO) as Parquet files. Implements at-least-once
# delivery with idempotent processing.
#
# No inbound Service is created — raw writer is a Kafka consumer and object
# storage writer only. Shared configuration is sourced from the
# platform-config ConfigMap; MinIO credentials from the shared
# minio-credentials Secret.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: raw-writer
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: raw-writer
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: raw-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raw-writer
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raw-writer
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: raw-writer
    spec:
      containers:
        - name: raw-writer
          image: ai-data-platform/raw-writer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.raw-writer.consumer"]
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_KAFKA_BOOTSTRAP_SERVERS
            - name: APP_KAFKA_GROUP_ID
              value: "raw-writer"
            - name: APP_MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_MINIO_ENDPOINT
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-access-key
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-secret-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
