# Lake Writer Deployment (TASK-074, updated TASK-078, TASK-079).
#
# Runs the lake writer service which consumes validated events from Kafka and
# persists them to Silver (MinIO) as Parquet files. Implements at-least-once
# delivery with idempotent processing using deterministic S3 keys derived
# from event_id.
#
# No inbound Service is created — lake writer is a Kafka consumer and object
# storage writer only. Shared configuration is sourced from the
# platform-config ConfigMap; MinIO credentials from the shared
# minio-credentials Secret.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lake-writer
  namespace: ai-data-platform
  labels:
    app.kubernetes.io/name: lake-writer
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: lake-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lake-writer
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lake-writer
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: lake-writer
    spec:
      containers:
        - name: lake-writer
          image: ai-data-platform/lake-writer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.lake-writer.consumer"]
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_KAFKA_BOOTSTRAP_SERVERS
            - name: APP_KAFKA_GROUP_ID
              value: "lake-writer"
            - name: APP_MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_MINIO_ENDPOINT
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-access-key
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-secret-key
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import os; os.getpid()"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('kafka',29092)); s.close()"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
