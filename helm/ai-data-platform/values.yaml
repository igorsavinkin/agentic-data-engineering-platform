# Default values for ai-data-platform Helm chart.
#
# This file contains the complete set of configuration knobs for every
# component in the platform.  Environment-specific overrides belong in
# values-local.yaml (development / kind) or values-production.yaml.
#
# Structure overview
# ------------------
#   global           – namespace, image pull policy, cross-cutting settings
#   images           – container image repository and tag per component
#   platform         – ConfigMap: platform-config (APP_* env vars)
#   database         – ConfigMap: database-config (WAREHOUSE_DB_* env vars)
#   secrets          – base64-encoded local-dev placeholders (never real creds)
#   <component>      – per-component: replicas, resources, probes, app config
#   minio/postgresql – infrastructure: optional in-cluster StatefulSets + Service
#   ingress          – Ingress resource for the API (disabled by default)
#   hpa              – HorizontalPodAutoscaler for the API (disabled by default)
#   networkPolicy    – NetworkPolicy for the platform namespace (disabled by default)

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
global:
  # Namespace where all resources are created.
  namespace: ai-data-platform
  # imagePullPolicy applied to every container. Use "Always" with a registry
  # and "IfNotPresent" for local kind development.
  imagePullPolicy: IfNotPresent

# Override the chart name or the full release name.
nameOverride: ""
fullnameOverride: ""

# Extra labels merged into every resource's metadata.labels.
commonLabels: {}

# ---------------------------------------------------------------------------
# Container images
# ---------------------------------------------------------------------------
# Each component specifies a repository and tag. For kind development the
# images are loaded locally with `kind load docker-image`.
images:
  ingestion:
    repository: ai-data-platform/ingestion
    tag: dev
  processor:
    repository: ai-data-platform/processor
    tag: dev
  rawWriter:
    repository: ai-data-platform/raw-writer
    tag: dev
  lakeWriter:
    repository: ai-data-platform/lake-writer
    tag: dev
  warehouseLoader:
    repository: ai-data-platform/warehouse-loader
    tag: dev
  api:
    repository: ai-data-platform/api
    tag: dev
  kafka:
    repository: apache/kafka
    tag: "4.3.1"

# ---------------------------------------------------------------------------
# Platform configuration — rendered into ConfigMap "platform-config"
# ---------------------------------------------------------------------------
# These values become APP_* environment variables consumed by all services.
platform:
  # APP_ENVIRONMENT — informational label used by services at startup.
  environment: production
  # APP_KAFKA_BOOTSTRAP_SERVERS — in-cluster Kafka address.
  kafkaBootstrapServers: "kafka:29092"
  # APP_MINIO_ENDPOINT — in-cluster MinIO/S3 address.
  minioEndpoint: "http://minio:9000"

# ---------------------------------------------------------------------------
# Database configuration — rendered into ConfigMap "database-config"
# ---------------------------------------------------------------------------
# These values become WAREHOUSE_DB_* environment variables consumed by
# warehouse-loader and api.
database:
  host: postgresql
  port: "5432"
  name: warehouse
  user: postgres

# ---------------------------------------------------------------------------
# Secrets — base64-encoded local-dev placeholders
# ---------------------------------------------------------------------------
# WARNING: These are NOT production credentials. They exist only to let the
# kind cluster start without manual secret creation. In production, replace
# with externally managed Secrets (e.g. Sealed Secrets, External Secrets).
secrets:
  minio:
    # minio-access-key (base64 of "minioadmin")
    accessKey: bWluaW9hZG1pbg==
    # minio-secret-key (base64 of "minioadmin-local")
    secretKey: bWluaW9hZG1pbi1sb2NhbA==
  database:
    # db-password (base64 of "postgres")
    password: cG9zdGdyZXM=
  ingestion:
    # bestbuy-api-key (base64 of placeholder)
    bestbuyApiKey: cGxhY2Vob2xkZXItcmVwbGFjZS1tZQ==

# ===========================================================================
# Service components
# ===========================================================================
# Each component section controls the Deployment for that service:
#   replicas        — number of pod replicas
#   resources       — CPU/memory requests and limits
#   livenessProbe   — liveness probe timing
#   readinessProbe  — readiness probe timing
# Plus component-specific APP_* configuration.

# ---------------------------------------------------------------------------
# Ingestion — source adapter fetch-publish loop (Kafka producer only)
# ---------------------------------------------------------------------------
ingestion:
  replicas: 1
  # APP_KAFKA_RAW_TOPIC — topic to publish raw product observations to.
  rawTopic: products.raw.v1
  # INGESTION_INTERVAL_SECONDS — seconds between fetch cycles.
  intervalSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# Processor — Kafka consumer/producer: validate, normalize, deduplicate
# ---------------------------------------------------------------------------
processor:
  replicas: 1
  # APP_KAFKA_GROUP_ID — consumer group for this service.
  groupId: processor
  # APP_KAFKA_AUTO_OFFSET_RESET — where to start reading on first connect.
  autoOffsetReset: earliest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# Raw Writer — Kafka consumer → Bronze Parquet on MinIO
# ---------------------------------------------------------------------------
rawWriter:
  replicas: 1
  groupId: raw-writer
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# Lake Writer — Kafka consumer → Silver Parquet on MinIO
# ---------------------------------------------------------------------------
lakeWriter:
  replicas: 1
  groupId: lake-writer
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# Warehouse Loader — batch reader: Gold Parquet → PostgreSQL (idempotent)
# ---------------------------------------------------------------------------
warehouseLoader:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# API — FastAPI serving layer (the only component with inbound HTTP)
# ---------------------------------------------------------------------------
api:
  replicas: 1
  # APP_API_HOST — bind address inside the container.
  host: "0.0.0.0"
  # APP_API_PORT — container port for the HTTP server.
  port: 8000
  service:
    # Kubernetes Service type. ClusterIP for in-cluster; use LoadBalancer
    # or NodePort for external access.
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# ---------------------------------------------------------------------------
# Kafka — single-broker KRaft mode (combined broker + controller)
# ---------------------------------------------------------------------------
kafka:
  replicas: 1
  # KAFKA_NODE_ID — broker identifier in the KRaft quorum.
  nodeId: 1
  # KAFKA_HEAP_OPTS — JVM heap settings for the Kafka process.
  heapOpts: "-Xmx512M -Xms256M"
  service:
    # NodePort for local kind development; use ClusterIP in production
    # with an Ingress or port-forward for external access.
    type: NodePort
    internalPort: 29092
    externalPort: 9092
    nodePort: 30092
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
  # Kafka topic creation Job settings.
  topics:
    backoffLimit: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ===========================================================================
# Infrastructure services
# ===========================================================================
# MinIO and PostgreSQL can run as in-cluster StatefulSets (enabled: true)
# for a self-contained kind deployment, or be treated as external services
# (enabled: false) where only the Service resource is created for DNS.

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: "RELEASE.2024-10-02T17-50-41Z"
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
  storage:
    size: 1Gi

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
  storage:
    size: 1Gi

# ===========================================================================
# Optional resources — disabled by default, enabled per environment
# ===========================================================================
# These resources have explicit values paths so they can be enabled in
# specific environments (e.g. production) without template forks.

# ---------------------------------------------------------------------------
# Ingress — external HTTP access to the API service
# ---------------------------------------------------------------------------
# Disabled by default for local kind development. Enable with an ingress
# controller (e.g. ingress-nginx) and configure the host accordingly.
ingress:
  enabled: false
  # Ingress class name (e.g. "nginx", "traefik").
  className: ""
  # Annotations applied to the Ingress resource.
  annotations: {}
  # TLS configuration.
  tls: []
  #  - secretName: api-tls
  #    hosts:
  #      - api.example.com
  # Host-based routing rules. The default routes to the API service.
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix

# ---------------------------------------------------------------------------
# HorizontalPodAutoscaler — automatic replica scaling for the API
# ---------------------------------------------------------------------------
# Disabled by default. Requires a metrics source (e.g. metrics-server).
hpa:
  enabled: false
  # Target deployment to scale.
  targetDeployment: api
  # Replica bounds.
  minReplicas: 1
  maxReplicas: 5
  # CPU utilization target percentage.
  targetCPUUtilizationPercentage: 80
  # Memory utilization target percentage (optional).
  # targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# NetworkPolicy — pod-level traffic restrictions
# ---------------------------------------------------------------------------
# Disabled by default. Requires a CNI that supports NetworkPolicy
# (e.g. Calico, Cilium). kind's default CNI (kindnet) has limited support.
networkPolicy:
  enabled: false
  # Policy type: which traffic to restrict.
  policyTypes:
    - Ingress
    - Egress
  # Ingress rules — allow traffic from within the namespace by default.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-data-platform
  # Egress rules — allow DNS and intra-namespace traffic by default.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ai-data-platform
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# ---------------------------------------------------------------------------
# Prometheus — metrics collection and scraping (TASK-084)
# ---------------------------------------------------------------------------
# Disabled by default for local kind development. Enable to deploy
# Prometheus for scraping platform service metrics.
prometheus:
  enabled: false
  image:
    repository: prom/prometheus
    tag: "v3.1.0"
  # How often Prometheus scrapes targets.
  scrapeInterval: 15s
  # How long to retain metrics data.
  retention: 7d
  # Port background services expose metrics on.
  metricsPort: 9100
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# Grafana — metrics visualization and dashboards (TASK-085)
# ---------------------------------------------------------------------------
# Disabled by default for local kind development. Enable to deploy Grafana
# connected to the in-cluster Prometheus instance.
grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: "11.4.0"
  # Admin credentials — base64-encoded for local-dev Secret.
  # Override with --set in production; never commit real credentials.
  adminUser: YWRtaW4=
  adminPassword: YWRtaW4=
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# OpenTelemetry — distributed tracing infrastructure (TASK-090)
# ---------------------------------------------------------------------------
# Disabled by default. Enable to deploy an OpenTelemetry Collector for
# receiving OTLP traces from platform services.
opentelemetry:
  enabled: false
  collector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.115.1"
    grpcPort: 4317
    httpPort: 4318
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  # Per-service OTel configuration. Services read these via APP_ env vars.
  config:
    enabled: false
    exporterEndpoint: "http://otel-collector:4317"
    exporterType: "otlp"
