{{- if .Values.airflow.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata-credentials
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: airflow-metadata-credentials
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  db-password: {{ .Values.secrets.airflow.metadataPassword | quote }}
{{- if and .Values.secrets.airflow.fernetKey .Values.secrets.airflow.secretKey }}
---
# airflow-keys is only created by Helm when fernetKey and secretKey are
# provided in values. For local development, provision this Secret externally:
#   bash scripts/create-local-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: airflow-keys
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: airflow-keys
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  fernet-key: {{ .Values.secrets.airflow.fernetKey | quote }}
  secret-key: {{ .Values.secrets.airflow.secretKey | quote }}
{{- end }}
{{- end }}
