apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: minio-credentials
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  minio-access-key: {{ .Values.secrets.minio.accessKey | quote }}
  minio-secret-key: {{ .Values.secrets.minio.secretKey | quote }}
