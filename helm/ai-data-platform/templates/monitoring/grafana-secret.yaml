{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: grafana-credentials
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  admin-user: {{ .Values.grafana.adminUser | default "admin" | b64enc | quote }}
  admin-password: {{ .Values.grafana.adminPassword | default "admin" | b64enc | quote }}
{{- end }}
