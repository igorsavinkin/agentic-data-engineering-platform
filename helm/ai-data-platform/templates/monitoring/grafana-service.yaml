{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ai-data-platform
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
{{- end }}
