{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ai-data-platform
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
{{- end }}
