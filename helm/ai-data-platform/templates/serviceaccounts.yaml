{{- if .Values.serviceAccounts.enabled }}
{{- range $key, $svc := .Values.serviceAccounts.services }}
{{- if $svc.annotations }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.name }}
  namespace: {{ include "ai-data-platform.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: {{ $key }}
  annotations:
    {{- range $annoKey, $annoVal := $svc.annotations }}
    {{ $annoKey }}: {{ $annoVal | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
