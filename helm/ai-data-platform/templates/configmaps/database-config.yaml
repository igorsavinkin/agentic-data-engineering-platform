apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: database-config
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: configuration
data:
  WAREHOUSE_DB_HOST: {{ .Values.database.host | quote }}
  WAREHOUSE_DB_PORT: {{ .Values.database.port | quote }}
  WAREHOUSE_DB_NAME: {{ .Values.database.name | quote }}
  WAREHOUSE_DB_USER: {{ .Values.database.user | quote }}
