apiVersion: batch/v1
kind: Job
metadata:
  name: warehouse-migration
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: warehouse-migration
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: warehouse
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.warehouse.migration.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-migration
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: warehouse
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.images.warehouseMigration.repository }}:{{ .Values.images.warehouseMigration.tag }}"
          command:
            - python
            - -c
            - |
              import os, socket, time, sys
              host = os.environ["WAREHOUSE_DB_HOST"]
              port = int(os.environ["WAREHOUSE_DB_PORT"])
              for attempt in range(1, 31):
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          print(f"PostgreSQL {host}:{port} ready (attempt {attempt})")
                          sys.exit(0)
                  except OSError:
                      print(f"Waiting for PostgreSQL {host}:{port} (attempt {attempt}/30)")
                      time.sleep(2)
              print("Timed out waiting for PostgreSQL", file=sys.stderr)
              sys.exit(1)
          env:
            - name: WAREHOUSE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_HOST
            - name: WAREHOUSE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_PORT
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: migration
          image: "{{ .Values.images.warehouseMigration.repository }}:{{ .Values.images.warehouseMigration.tag }}"
          command:
            - python
            - -m
            - warehouse.migrations
            - upgrade
            - head
          env:
            - name: WAREHOUSE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_HOST
            - name: WAREHOUSE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_PORT
            - name: WAREHOUSE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_NAME
            - name: WAREHOUSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_USER
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: db-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.warehouse.migration.resources | nindent 12 }}
