apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "services.api"]
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_API_HOST
              value: {{ .Values.api.host | quote }}
            - name: APP_API_PORT
              value: {{ .Values.api.port | quote }}
            - name: WAREHOUSE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_HOST
            - name: WAREHOUSE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_PORT
            - name: WAREHOUSE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_NAME
            - name: WAREHOUSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_USER
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: db-password
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
