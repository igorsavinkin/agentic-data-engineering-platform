apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-loader
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: warehouse-loader
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: warehouse-loader
spec:
  replicas: {{ .Values.warehouseLoader.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse-loader
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse-loader
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: warehouse-loader
    spec:
      containers:
        - name: warehouse-loader
          image: "{{ .Values.images.warehouseLoader.repository }}:{{ .Values.images.warehouseLoader.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "services.warehouse-loader.runner"]
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_MINIO_ENDPOINT
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-access-key
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-secret-key
            - name: WAREHOUSE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_HOST
            - name: WAREHOUSE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_PORT
            - name: WAREHOUSE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_NAME
            - name: WAREHOUSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: WAREHOUSE_DB_USER
            - name: WAREHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: db-password
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import os; os.kill(1, 0)"
            initialDelaySeconds: {{ .Values.warehouseLoader.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.warehouseLoader.livenessProbe.periodSeconds }}
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('postgresql',5432)); s.close()"
            initialDelaySeconds: {{ .Values.warehouseLoader.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.warehouseLoader.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.warehouseLoader.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.warehouseLoader.resources | nindent 12 }}
