apiVersion: apps/v1
kind: Deployment
metadata:
  name: lake-writer
  namespace: {{ include "ai-data-platform.namespace" . }}
  labels:
    app.kubernetes.io/name: lake-writer
    app.kubernetes.io/part-of: ai-data-platform
    app.kubernetes.io/component: lake-writer
spec:
  replicas: {{ .Values.lakeWriter.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lake-writer
      app.kubernetes.io/part-of: ai-data-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lake-writer
        app.kubernetes.io/part-of: ai-data-platform
        app.kubernetes.io/component: lake-writer
    spec:
      containers:
        - name: lake-writer
          image: "{{ .Values.images.lakeWriter.repository }}:{{ .Values.images.lakeWriter.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "services.lake-writer.consumer"]
          ports:
            - containerPort: {{ .Values.prometheus.metricsPort }}
              protocol: TCP
              name: metrics
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_ENVIRONMENT
            - name: APP_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_KAFKA_BOOTSTRAP_SERVERS
            - name: APP_KAFKA_GROUP_ID
              value: {{ .Values.lakeWriter.groupId | quote }}
            - name: APP_MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: APP_MINIO_ENDPOINT
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-access-key
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-secret-key
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import os; os.kill(1, 0)"
            initialDelaySeconds: {{ .Values.lakeWriter.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.lakeWriter.livenessProbe.periodSeconds }}
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import socket; s=socket.socket(); s.settimeout(2); s.connect(('kafka',29092)); s.close()"
            initialDelaySeconds: {{ .Values.lakeWriter.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.lakeWriter.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.lakeWriter.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.lakeWriter.resources | nindent 12 }}
