name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-local
          POSTGRES_DB: warehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests (pytest)
        run: pytest

      - name: Integration tests (warehouse migrations)
        env:
          WAREHOUSE_DB_HOST: localhost
          WAREHOUSE_DB_PORT: 5432
          WAREHOUSE_DB_NAME: warehouse_test
          WAREHOUSE_DB_USER: platform
          WAREHOUSE_DB_PASSWORD: platform-local
        run: pytest tests/warehouse/test_migrations.py -v -m integration

      - name: Repository structure validation
        run: python scripts/verify_repository_structure.py
