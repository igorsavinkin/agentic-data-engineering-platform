[project]
name = "ai-data-platform"
version = "0.1.0"
description = "AI Data Platform - distributed data engineering and agentic AI platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["libs"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["scripts", "tests", "libs"]
mypy_path = "."
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Unit tests run by default; the Docker Compose stack tests are opt-in
# (`pytest -m integration`) so a plain test run stays fast and hermetic.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that need external infrastructure (Docker); run with: pytest -m integration",
]
