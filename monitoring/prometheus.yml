# Prometheus scrape configuration for local development (TASK-084).
#
# Prometheus scrapes /metrics from each platform service. Services expose
# metrics on dedicated ports (9100 for background services, 8000 for the
# API service). Scrape interval is 15 seconds — sufficient for development
# without excessive load.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ai-data-platform"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: api

  - job_name: "ai-data-platform-background"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9100"
        labels:
          service: background
