# Grafana datasource provisioning for local development (TASK-085).
#
# Prometheus is the default datasource for metrics. Jaeger is available
# for distributed trace viewing (TASK-091).

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
