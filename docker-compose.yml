# Local development infrastructure for the AI Data Platform (TASK-004).
#
# Kafka (event backbone), MinIO (S3-compatible object storage for the raw and
# lake zones), and PostgreSQL (warehouse and platform metadata).
#
# Usage (see docs/local-development.md):
#   docker compose up -d --wait
#
# LOCAL DEVELOPMENT ONLY. Production runs on Kubernetes (ai/SPECIFICATION.md
# §19); production configuration is supplied by the deployment environment,
# never by this repository.
#
# Variables without the APP_ prefix configure the stack itself (Docker
# Compose substitution and image settings). APP_-prefixed variables configure
# application services (see docs/configuration.md). Both kinds can share the
# same .env file; every variable below has a working default.

name: ai-data-platform

services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # Single-node KRaft: one process acts as both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two PLAINTEXT listeners: one for other containers on the shared
      # network, one for host applications. The advertised host listener must
      # advertise the host port so clients get usable metadata.
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node replication settings.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # Topics are created explicitly (ai/SPECIFICATION.md §8), never on the fly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
      # Fixed cluster ID so a recreated container reuses the formatted volume.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - platform
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-local}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - platform
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-local}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kafka_data:
  minio_data:
  postgres_data:

networks:
  # Fixed name so application services (later tasks) and other Compose
  # projects can join the same network.
  platform:
    name: ${PLATFORM_NETWORK_NAME:-ai-data-platform}
